<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>进制转换</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 20px;
  }
  .container {
    width: 100%;
    max-width: 720px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px;
  }
  h1 {
    font-size: 22px;
    color: #303133;
    margin-bottom: 8px;
  }
  .description {
    color: #606266;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .field {
    margin-bottom: 20px;
  }
  .field-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    color: #303133;
    font-size: 15px;
    font-weight: 600;
  }
  .field-title span {
    color: #909399;
    font-size: 12px;
    font-weight: normal;
  }
  .base-options {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }
  .base-option {
    position: relative;
    display: block;
    min-height: 44px;
    border: 1px solid #dcdfe6;
    border-radius: 8px;
    background: #fff;
    color: #606266;
    font-size: 14px;
    text-align: center;
    line-height: 42px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
    touch-action: manipulation;
  }
  .base-option:hover {
    border-color: #409eff;
    color: #409eff;
  }
  .base-option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }
  .base-option:has(input:checked) {
    border-color: #409eff;
    background: #ecf5ff;
    color: #409eff;
    font-weight: 600;
  }
  .base-option input:focus-visible + .base-text {
    outline: 2px solid #409eff;
    outline-offset: 2px;
  }
  .custom-base-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .custom-base-row label {
    flex: 0 0 auto;
    color: #606266;
    font-size: 14px;
  }
  .custom-base-row input {
    width: 110px;
    min-height: 44px;
    padding: 10px 12px;
    border: 1px solid #dcdfe6;
    border-radius: 8px;
    color: #303133;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .custom-base-row input:focus {
    border-color: #409eff;
  }
  input[type="text"],
  .result {
    width: 100%;
    min-height: 48px;
    padding: 12px 14px;
    border: 1px solid #dcdfe6;
    border-radius: 8px;
    color: #303133;
    background: #fff;
    font-size: 16px;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"] {
    font-family: Menlo, Consolas, "Courier New", monospace;
  }
  input[type="text"]:focus {
    border-color: #409eff;
  }
  .result {
    overflow-wrap: anywhere;
    background: #f5f7fa;
    font-family: Menlo, Consolas, "Courier New", monospace;
  }
  .result.error {
    color: #f56c6c;
    background: #fef0f0;
    border-color: #fbc4c4;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 18px;
  }
  button {
    padding: 12px 24px;
    min-height: 44px;
    border: 1px solid #dcdfe6;
    border-radius: 6px;
    background: #fff;
    color: #606266;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    touch-action: manipulation;
  }
  button:hover {
    border-color: #409eff;
    color: #409eff;
  }
  button.primary {
    background: #409eff;
    border-color: #409eff;
    color: #fff;
  }
  button.primary:hover {
    background: #66b1ff;
    border-color: #66b1ff;
  }
  .status {
    min-height: 20px;
    margin-top: 10px;
    color: #909399;
    font-size: 13px;
    text-align: right;
  }
  @media (max-width: 640px) {
    body {
      padding: 24px 12px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      align-items: stretch;
    }
    .container {
      padding: 20px 16px;
      border-radius: 10px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 6px;
    }
    .description {
      margin-bottom: 18px;
    }
    .base-options {
      grid-template-columns: repeat(3, 1fr);
    }
    .actions {
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 12px 16px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <h1>进制转换</h1>
    <p class="description">支持 2~36 进制之间的任意转换，支持浮点型数字。</p>

    <div class="field">
      <div class="field-title">输入进制 <span>选择待转换数字的进制</span></div>
      <div class="base-options" id="sourceOptions">
        <label class="base-option"><input type="radio" name="sourceBase" value="2"><span class="base-text">2 进制</span></label>
        <label class="base-option"><input type="radio" name="sourceBase" value="4"><span class="base-text">4 进制</span></label>
        <label class="base-option"><input type="radio" name="sourceBase" value="8"><span class="base-text">8 进制</span></label>
        <label class="base-option"><input type="radio" name="sourceBase" value="10" checked><span class="base-text">10 进制</span></label>
        <label class="base-option"><input type="radio" name="sourceBase" value="16"><span class="base-text">16 进制</span></label>
        <label class="base-option"><input type="radio" name="sourceBase" value="32"><span class="base-text">32 进制</span></label>
      </div>
      <div class="custom-base-row">
        <label for="sourceBaseCustomBase">自定义进制</label>
        <input type="number" id="sourceBaseCustomBase" min="2" max="36" step="1" placeholder="2~36" inputmode="numeric">
      </div>
    </div>

    <div class="field">
      <label class="field-title" for="numberInput">转换数字</label>
      <input type="text" id="numberInput" placeholder="在此输入待转换数字" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <div class="field-title">输出进制 <span>选择转换结果进制</span></div>
      <div class="base-options" id="targetOptions">
        <label class="base-option"><input type="radio" name="targetBase" value="2"><span class="base-text">2 进制</span></label>
        <label class="base-option"><input type="radio" name="targetBase" value="4"><span class="base-text">4 进制</span></label>
        <label class="base-option"><input type="radio" name="targetBase" value="8"><span class="base-text">8 进制</span></label>
        <label class="base-option"><input type="radio" name="targetBase" value="10"><span class="base-text">10 进制</span></label>
        <label class="base-option"><input type="radio" name="targetBase" value="16" checked><span class="base-text">16 进制</span></label>
        <label class="base-option"><input type="radio" name="targetBase" value="32"><span class="base-text">32 进制</span></label>
      </div>
      <div class="custom-base-row">
        <label for="targetBaseCustomBase">自定义进制</label>
        <input type="number" id="targetBaseCustomBase" min="2" max="36" step="1" placeholder="2~36" inputmode="numeric">
      </div>
    </div>

    <div class="field">
      <div class="field-title">转换结果</div>
      <div class="result" id="result">转换结果</div>
      <div class="status" id="status"></div>
    </div>

    <div class="actions">
      <button id="swapButton">互换进制</button>
      <button id="pasteButton">粘贴</button>
      <button id="copyButton" class="primary">复制结果</button>
    </div>
  </div>

<script>
  const numberInput = document.getElementById('numberInput');
  const result = document.getElementById('result');
  const status = document.getElementById('status');
  const digits = '0123456789abcdefghijklmnopqrstuvwxyz';

  function getBase(name) {
    const customBase = document.getElementById(`${name}CustomBase`);
    const customValue = Number(customBase.value);

    if (customBase.value.trim() !== '') {
      if (!Number.isInteger(customValue) || customValue < 2 || customValue > 36) {
        throw new Error('自定义进制必须是 2~36 的整数');
      }
      return customValue;
    }

    return Number(document.querySelector(`input[name="${name}"]:checked`).value);
  }

  function digitValue(character, base) {
    const value = digits.indexOf(character.toLowerCase());
    if (value < 0 || value >= base) return -1;
    return value;
  }

  function parseRadix(text, base) {
    const normalized = text.trim().toLowerCase();
    if (!/^[+-]?(?:(?:[0-9a-z]+)(?:\.[0-9a-z]*)?|\.[0-9a-z]+)$/.test(normalized)) {
      throw new Error('请输入合法数字');
    }

    const negative = normalized.startsWith('-');
    const unsigned = normalized.replace(/^[+-]/, '');
    const [integerText, fractionText = ''] = unsigned.split('.');
    let integer = 0n;
    let numerator = 0n;
    let denominator = 1n;

    for (const character of integerText) {
      const value = digitValue(character, base);
      if (value < 0) throw new Error(`“${character.toUpperCase()}”不是 ${base} 进制数字`);
      integer = integer * BigInt(base) + BigInt(value);
    }

    for (let index = 0; index < fractionText.length; index++) {
      const character = fractionText[index];
      const value = digitValue(character, base);
      if (value < 0) throw new Error(`“${character.toUpperCase()}”不是 ${base} 进制数字`);
      denominator *= BigInt(base);
      numerator = numerator * BigInt(base) + BigInt(value);
    }

    return { negative, integer, numerator, denominator };
  }

  function formatRadix(number, base) {
    const negative = number.negative && (number.integer !== 0n || number.numerator !== 0n);
    let integerText = number.integer.toString(base);
    let fractionText = '';
    let numerator = number.numerator;
    const denominator = number.denominator;

    for (let index = 0; index < 16 && numerator > 0n; index++) {
      numerator *= BigInt(base);
      const digit = numerator / denominator;
      numerator %= denominator;
      fractionText += digits[Number(digit)];
    }

    fractionText = numerator === 0n ? fractionText.replace(/0+$/, '') : fractionText;
    return `${negative ? '-' : ''}${integerText}${fractionText ? `.${fractionText}` : ''}`.toUpperCase();
  }

  function convert() {
    const input = numberInput.value.trim();
    status.textContent = '';
    result.classList.remove('error');

    if (!input) {
      result.textContent = '转换结果';
      return;
    }

    try {
      const sourceBase = getBase('sourceBase');
      const targetBase = getBase('targetBase');
      const parsed = parseRadix(input, sourceBase);
      result.textContent = formatRadix(parsed, targetBase);
    } catch (error) {
      result.textContent = error.message;
      result.classList.add('error');
    }
  }

  document.querySelectorAll('input[name="sourceBase"], input[name="targetBase"]').forEach(input => {
    input.addEventListener('change', () => {
      document.getElementById(`${input.name}CustomBase`).value = '';
      convert();
    });
  });
  document.querySelectorAll('#sourceBaseCustomBase, #targetBaseCustomBase').forEach(input => {
    input.addEventListener('input', convert);
  });
  numberInput.addEventListener('input', convert);

  document.getElementById('swapButton').addEventListener('click', () => {
    const source = document.querySelector('input[name="sourceBase"]:checked');
    const target = document.querySelector('input[name="targetBase"]:checked');
    const sourceCustomBase = document.getElementById('sourceBaseCustomBase');
    const targetCustomBase = document.getElementById('targetBaseCustomBase');
    const sourceValue = source.value;
    const sourceCustomValue = sourceCustomBase.value;
    source.value = target.value;
    target.value = sourceValue;
    sourceCustomBase.value = targetCustomBase.value;
    targetCustomBase.value = sourceCustomValue;
    source.checked = true;
    target.checked = true;
    convert();
  });

  document.getElementById('pasteButton').addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) {
        numberInput.value = text.trim();
        convert();
      }
      numberInput.focus();
    } catch (error) {
      status.textContent = '无法读取剪贴板，请长按输入框选择粘贴。';
    }
  });

  document.getElementById('copyButton').addEventListener('click', async () => {
    if (!result.textContent || result.textContent === '转换结果' || result.classList.contains('error')) {
      status.textContent = '暂无可复制的结果。';
      return;
    }

    try {
      await navigator.clipboard.writeText(result.textContent);
      status.textContent = '已复制转换结果。';
    } catch (error) {
      status.textContent = '复制失败，请手动选择结果复制。';
    }
  });

  convert();
</script>
</body>
</html>
