<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>字数统计</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 20px;
  }
  .container {
    width: 100%;
    max-width: 640px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px;
  }
  h1 {
    font-size: 20px;
    color: #333;
    margin-bottom: 20px;
  }
  textarea {
    width: 100%;
    height: 240px;
    padding: 14px;
    border: 1px solid #dcdfe6;
    border-radius: 8px;
    font-size: 16px; /* >=16px 防止 iOS 聚焦时自动缩放页面 */
    line-height: 1.7;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: #409eff; }
  .actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
  }
  button {
    padding: 12px 32px;
    min-height: 44px; /* 保证移动端触控区域 */
    border: 1px solid #dcdfe6;
    border-radius: 6px;
    background: #fff;
    color: #606266;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    touch-action: manipulation; /* 消除移动端点击 300ms 延迟 */
  }
  button:hover { border-color: #409eff; color: #409eff; }
  button.primary {
    background: #409eff;
    border-color: #409eff;
    color: #fff;
  }
  button.primary:hover { background: #66b1ff; border-color: #66b1ff; }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat-item {
    flex: 1;
    min-width: 110px;
    background: #f5f7fa;
    border-radius: 8px;
    padding: 12px 16px;
    text-align: center;
  }
  .stat-item .num {
    font-size: 24px;
    font-weight: 600;
    color: #409eff;
  }
  .stat-item .label {
    font-size: 12px;
    color: #909399;
    margin-top: 4px;
  }

  /* 移动端适配 */
  @media (max-width: 480px) {
    body {
      padding: 24px 12px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom)); /* 适配全面屏底部安全区 */
    }
    .container {
      padding: 20px 16px;
      border-radius: 10px;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 16px;
    }
    .stats {
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-item {
      /* 2 列布局 */
      flex: 0 0 calc(50% - 5px);
      min-width: 0;
      padding: 10px 8px;
    }
    .stat-item .num {
      font-size: 20px;
    }
    .stat-item .label {
      font-size: 11px;
    }
    textarea {
      height: 200px;
      padding: 12px;
    }
    .actions {
      gap: 10px;
      margin-top: 14px;
    }
    button {
      /* 按钮平分宽度，方便点按 */
      flex: 1;
      padding: 12px 16px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <h1>字数统计</h1>
    <div class="stats">
      <div class="stat-item">
        <div class="num" id="total">0</div>
        <div class="label">总字符数（含空格）</div>
      </div>
      <div class="stat-item">
        <div class="num" id="noSpace">0</div>
        <div class="label">字符数（不含空格）</div>
      </div>
      <div class="stat-item">
        <div class="num" id="chinese">0</div>
        <div class="label">汉字数</div>
      </div>
      <div class="stat-item">
        <div class="num" id="words">0</div>
        <div class="label">英文单词数</div>
      </div>
    </div>
    <textarea id="input" placeholder="请输入或粘贴文本，实时统计字数..."></textarea>
    <div class="actions">
      <button class="primary" id="pasteBtn">粘贴</button>
      <button id="clearBtn">清空</button>
    </div>
  </div>

<script>
  const input = document.getElementById('input');
  const els = {
    total: document.getElementById('total'),
    noSpace: document.getElementById('noSpace'),
    chinese: document.getElementById('chinese'),
    words: document.getElementById('words'),
  };

  function count() {
    const text = input.value;
    const noSpaceText = text.replace(/\s/g, '');
    const chineseCount = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
    const wordCount = (text.match(/[a-zA-Z]+/g) || []).length;

    els.total.textContent = text.length;
    els.noSpace.textContent = noSpaceText.length;
    els.chinese.textContent = chineseCount;
    els.words.textContent = wordCount;
  }

  input.addEventListener('input', count);
  count();

  document.getElementById('pasteBtn').addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) {
        input.value = text;
        count();
      }
    } catch (e) {
      alert('无法读取剪贴板，请长按输入框选择粘贴（电脑上可用 Ctrl/Cmd+V）。');
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    input.value = '';
    count();
    input.focus();
  });
</script>
</body>
</html>
